<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pas touche à mes trésors · galerie des modèles</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #9dbbdc; font: 13px/1.3 system-ui, -apple-system, "Segoe UI", sans-serif; color: #1d2a1a; }
  canvas { display: block; touch-action: none; }
  #ui { position: fixed; left: 8px; top: 8px; max-width: min(560px, calc(100vw - 16px)); display: flex; flex-direction: column; gap: 6px; z-index: 5; }
  #ui .row { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  #ui button { font: inherit; border: 0; border-radius: 9px; padding: 5px 9px; background: #fff7e6; color: #3b2a14; box-shadow: 0 2px 0 #c9a86a, 0 3px 8px rgba(0,0,0,.18); cursor: pointer; }
  #ui button[aria-pressed="true"] { background: #7fae4b; color: #fff; box-shadow: 0 2px 0 #4f7a26, 0 3px 8px rgba(0,0,0,.2); }
  #ui .title { font-weight: 700; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.55); margin-right: 6px; }
  #ui.hidden .row:not(:first-child) { display: none; }
  #stats { position: fixed; right: 8px; bottom: 8px; color: #fff; text-shadow: 0 1px 2px #000; font: 11px/1.35 ui-monospace, monospace; text-align: right; white-space: pre; pointer-events: none; }
  .lbl { position: fixed; left: 0; top: 0; transform: translate(-50%, -100%); color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.85), 0 0 6px rgba(0,0,0,.4); font-weight: 650; font-size: 11px; white-space: nowrap; pointer-events: none; will-change: transform; }
  .lbl small { display: block; font-weight: 500; opacity: .85; text-align: center; }
  body.nolabels .lbl { display: none; }
</style>
</head>
<body>
<div id="ui">
  <div class="row"><span class="title">Pas touche à mes trésors · modèles</span><button data-k="h" title="Masquer/afficher (H)">☰</button></div>
  <div class="row" id="sections"></div>
  <div class="row"><button data-k="w">Élan (W)</button><button data-k="f">Tir (F)</button><button data-k="p">Pulsation (P)</button><button data-k="u">Évolution (U)</button><button data-k="n">Palier suivant (N)</button><button data-k="a" data-toggle="auto">Attaque auto (A)</button></div>
  <div class="row"><button data-k="s" data-toggle="sel">Sélection (S)</button><button data-k="z" data-toggle="frenzy">Frénésie (Z)</button><button data-k="y" data-toggle="sweep">Visée tournante (Y)</button><button data-k="t">Déclencher pièges (T)</button><button data-k="r" data-toggle="unready">Pièges en recharge (R)</button></div>
  <div class="row"><button data-k="o">Ouvrir coffres (O)</button><button data-k="k">Stock (K)</button><button data-k="l" data-toggle="alarm">Alarme (L)</button><button data-k="c">États des socles (C)</button><button data-k="v">Vue (V)</button><button data-k="b" data-toggle="labels">Étiquettes (B)</button></div>
</div>
<div id="stats"></div>
<script>
"use strict";
(function () {
  const q = new URLSearchParams(location.search);
  const files = [
    "../../static/assets/engine-0.40e246fcf208.js",
    "../core/00-ptmt.js",
    "../models/10-kit.js",
    "../models/20-towers-fire.js",
    "../models/21-towers-ice.js",
    "../models/22-towers-water.js",
    "../models/30-traps.js",
    "../models/31-sockets.js",
    "../models/40-chests.js",
    "../models/50-buildings.js",
    "../models/60-mill-upgrades.js",
  ];
  (function load(i) {
    if (i >= files.length) return start();
    const s = document.createElement("script");
    s.src = files[i];
    s.onload = () => load(i + 1);
    s.onerror = () => { console.warn("galerie : fichier absent " + files[i]); load(i + 1); };
    document.head.appendChild(s);
  })(0);

  function start() {
    const PTMT = globalThis.PTMT, M = PTMT.models, K = M.kit;
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = PTMT.color("#a8c8ea");
    scene.fog = new THREE.Fog(PTMT.color("#b8d2ec"), 90, 260);
    const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 600);
    const hemi = new THREE.HemisphereLight(0xbcd6ff, 0x5b6b3a, 0.85);
    scene.add(hemi);
    const sun = new THREE.DirectionalLight(0xfff2e2, 2.1);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.bias = -0.00016;
    sun.shadow.normalBias = 0.035;
    sun.shadow.radius = 3;
    scene.add(sun, sun.target);
    // Environnement de reflets (même principe que la scène du moulin : dégradé ciel / sol).
    if (q.get("env") !== "0") {
      const W = 256, H = 128, px = new Uint8Array(W * H * 4);
      for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
        const r = y / (H - 1), s = Math.min(1, Math.abs(r - 0.5) * 2);
        const a = r < 0.5 ? [194, 210, 210] : [124, 139, 112], b = r < 0.5 ? [128, 165, 185] : [70, 84, 62];
        for (let k = 0; k < 3; k++) px[(y * W + x) * 4 + k] = a[k] * (1 - s) + b[k] * s;
        px[(y * W + x) * 4 + 3] = 255;
      }
      const et = new THREE.DataTexture(px, W, H, THREE.RGBAFormat);
      et.encoding = THREE.sRGBEncoding; et.mapping = THREE.EquirectangularReflectionMapping; et.needsUpdate = true;
      const pm = new THREE.PMREMGenerator(renderer);
      scene.environment = pm.fromEquirectangular(et).texture;
      pm.dispose();
    }

    // Sol herbeux (texture de la galerie uniquement).
    const gcv = document.createElement("canvas");
    gcv.width = gcv.height = 256;
    const gg = gcv.getContext("2d");
    const img = gg.createImageData(256, 256);
    const nz = K.noise;
    for (let y = 0; y < 256; y++) for (let x = 0; x < 256; x++) {
      const n = nz.fbm(x / 256, y / 256, 4, 3, 4), h = nz.hash2(x, y, 7);
      const i = (y * 256 + x) * 4;
      img.data[i] = 58 + n * 34 + h * 14; img.data[i + 1] = 88 + n * 40 + h * 18; img.data[i + 2] = 34 + n * 14; img.data[i + 3] = 255;
    }
    gg.putImageData(img, 0, 0);
    const gtex = new THREE.CanvasTexture(gcv);
    gtex.encoding = THREE.sRGBEncoding; gtex.wrapS = gtex.wrapT = THREE.RepeatWrapping; gtex.repeat.set(90, 90); gtex.anisotropy = 8;
    const ground = new THREE.Mesh(new THREE.PlaneGeometry(500, 500), new THREE.MeshStandardMaterial({ map: gtex, roughness: 0.95 }));
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // Silhouette de référence : un voleur de 1,8 m.
    function mannequin() {
      const g = new THREE.Group();
      const m = new THREE.MeshStandardMaterial({ color: PTMT.color("#c9c2b5"), roughness: 0.8 });
      const body = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.26, 1.3, 12), m); body.position.y = 0.65; body.castShadow = true;
      const head = new THREE.Mesh(new THREE.SphereGeometry(0.22, 14, 10), m); head.position.y = 1.56; head.castShadow = true;
      const mask = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.08, 0.1), new THREE.MeshStandardMaterial({ color: 0x151515 })); mask.position.set(0, 1.6, 0.17);
      g.add(body, head, mask);
      return g;
    }

    const items = [];
    const labels = [];
    let sectionGroup = null;
    const state = { auto: false, sel: false, frenzy: false, sweep: false, unready: false, alarm: false, labels: q.get("labels") !== "0", open: 0, stock: 3, sockState: 0, time: 0 };
    const SOCK = ["idle", "hover", "valid", "invalid"];
    const view = { mode: q.get("view") || "aerial", yaw: +(q.get("yaw") || 0), pitch: 50, dist: 35, target: new THREE.Vector3() };

    const FAM = { fire: "Feu", ice: "Glace", water: "Eau" };
    const TNAME = {
      fire1: "Brasier grognon", fire2A: "Souffle infernal", fire3A: "Dragon de la fournaise", fire2B: "Crache-lave", fire3B: "Volcan furieux",
      ice1: "Obélisque givré", ice2A: "Crypte du gel", ice3A: "Trône du zéro absolu", ice2B: "Souffleur de blizzard", ice3B: "Tempête polaire",
      water1: "Gargouille cracheuse", water2A: "Bélier hydraulique", water3A: "Canon tsunami", water2B: "Fontaine siphon", water3B: "Maelström glouton",
    };
    const VAR = [[1, null, "I"], [2, "A", "II-A"], [3, "A", "III-A"], [2, "B", "II-B"], [3, "B", "III-B"]];
    const EVO = [[1, null], [2, "A"], [3, "A"], [1, null], [2, "B"], [3, "B"]];

    const SECTIONS = {
      tours: { name: "Tours", build: buildTowers },
      pieges: { name: "Pièges", build: buildTraps },
      socles: { name: "Socles", build: buildSockets },
      coffres: { name: "Coffres", build: buildChests },
      batiments: { name: "Bâtiments", build: buildBuildings },
      moulin: { name: "Moulin", build: buildMill },
    };
    const sectionsEl = document.getElementById("sections");
    for (const [k, s] of Object.entries(SECTIONS)) {
      const b = document.createElement("button");
      b.textContent = s.name;
      b.dataset.section = k;
      b.onclick = () => showSection(k);
      sectionsEl.appendChild(b);
    }

    function addLabel(obj, text, sub, y) {
      const el = document.createElement("div");
      el.className = "lbl";
      el.innerHTML = text + (sub ? "<small>" + sub + "</small>" : "");
      document.body.appendChild(el);
      labels.push({ el, obj, y });
    }
    function place(api, x, z, label, sub, extra) {
      api.object.position.set(x, 0, z);
      sectionGroup.add(api.object);
      const it = Object.assign({ api, label, x, z }, extra || {});
      items.push(it);
      addLabel(api.object, label, sub, (api.height || 2) + 0.5);
      return it;
    }
    function ref(x, z) {
      const m = mannequin();
      m.position.set(x, 0, z);
      sectionGroup.add(m);
      addLabel(m, "voleur", "1,8 m", 2.1);
    }

    function buildTowers() {
      const fams = ["fire", "ice", "water"];
      if (!M.tower) return;
      fams.forEach((f, row) => {
        VAR.forEach(([tier, br, nm], c) => {
          const key = f + tier + (br || "");
          if (!K.towers[key]) return;
          const api = M.tower(f, tier, br);
          place(api, (c - 2) * 5.2, (row - 1) * 5.6, FAM[f] + " " + nm, TNAME[key], { kind: "tower", key, tier, br, fam: f });
        });
      });
      // Démonstration d'évolution (touche N).
      fams.forEach((f, i) => {
        if (!K.towers[f + "1"]) return;
        const api = M.tower(f, 1, null);
        place(api, 16.5, (i - 1) * 5.6, "Évolution " + FAM[f], "N : palier suivant", { kind: "tower", evo: 0, fam: f });
      });
      ref(-14.5, 0);
      return { center: [0.8, 0, 0.5], dist: 36, close: { center: [-5.2, 0, 5.6], dist: 11, pitch: 20 } };
    }
    function buildTraps() {
      if (!M.trap) return;
      ["net", "spring", "lure"].forEach((kind, row) => {
        for (let t = 1; t <= 3; t++) {
          const api = M.trap(kind, t);
          place(api, (t - 2) * 3.2, (row - 1) * 3.2, { net: "Filet", spring: "Ressort farceur", lure: "Faux coffre" }[kind] + " " + t, null, { kind: "trap", trap: kind });
        }
      });
      ref(-6.2, 0);
      return { center: [0, 0, 0], dist: 17, close: { center: [0, 0, 1.5], dist: 9, pitch: 26 } };
    }
    function buildSockets() {
      if (!M.socket) return;
      ["fire", "ice", "water"].forEach((kind, row) => {
        SOCK.forEach((s, c) => {
          const api = M.socket(kind);
          api.setState(s);
          place(api, (c - 1.5) * 3.2, (row - 1) * 3.2, FAM[kind], s, { kind: "socket", sock: c });
        });
      });
      ref(-7.5, 0);
      return { center: [0, 0, 0], dist: 17, close: { center: [0, 0, 2], dist: 9, pitch: 30 } };
    }
    function buildChests() {
      if (!M.chest) return;
      const names = ["Coffre de bois", "Coffre à trois serrures", "Coffre hurleur"];
      for (let t = 1; t <= 3; t++) {
        const a = M.chest(t);
        a.setStock(3, 3);
        place(a, (t - 2) * 3.4, -1.8, names[t - 1], "stock 3/3", { kind: "chest", tier: t, row: 0 });
        const b = M.chest(t);
        b.setStock(1, 3);
        b.setOpenProgress(0.75);
        if (t === 3) b.alarm(true);
        place(b, (t - 2) * 3.4, 1.8, names[t - 1], t === 3 ? "ouvert + alarme" : "ouvert, stock 1/3", { kind: "chest", tier: t, row: 1 });
      }
      ref(-6, 0);
      return { center: [0, 0, 0], dist: 15, close: { center: [0, 0, 1], dist: 8, pitch: 26 } };
    }
    function buildBuildings() {
      if (!M.building) return;
      const kinds = [["grange", "Grange"], ["cabane", "Cabane du sorcier"], ["pilotis", "Entrepôt sur pilotis"], ["sanctuaire", "Sanctuaire de l'île"], ["crypte", "Crypte"]];
      kinds.forEach(([k, n], i) => {
        const b = M.building(k);
        const x = (i % 3 - 1) * 13, z = i < 3 ? -7 : 7;
        const api = { object: b.object, height: 7, update: b.update, dispose: b.dispose, info: b };
        place(api, i < 3 ? x : x + 6.5, z, n, null, { kind: "building" });
        // Marqueurs : porte (vert) et emplacement du coffre (or).
        const dm = new THREE.Mesh(new THREE.ConeGeometry(0.25, 0.6, 8), new THREE.MeshBasicMaterial({ color: 0x33ff66 }));
        dm.position.set(b.door.x, 0.3, b.door.z);
        dm.rotation.x = Math.PI;
        b.object.add(dm);
        const cm = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.05, 0.5), new THREE.MeshBasicMaterial({ color: 0xffcc33 }));
        cm.position.set(b.chestSlot.x, b.chestSlot.y + 0.03, b.chestSlot.z);
        b.object.add(cm);
        if (M.chest) {
          const c = M.chest(1 + (i % 3));
          c.setStock(2, 3);
          c.object.position.set(b.chestSlot.x, b.chestSlot.y, b.chestSlot.z);
          c.object.rotation.y = b.door.yaw;
          b.object.add(c.object);
          items.push({ api: c, kind: "chest", tier: 1 + (i % 3), row: 0, attached: true });
        }
        // Emprise (ligne au sol).
        const pts = b.footprint.map(([x, z]) => new THREE.Vector3(x, 0.06, z));
        pts.push(pts[0].clone());
        const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({ color: 0xff3355 }));
        b.object.add(line);
      });
      ref(-2, 0);
      return { center: [0, 0, 0], dist: 44, close: { center: [-13, 0, -5], dist: 18, pitch: 24 } };
    }
    function buildMill() {
      if (!M.millUpgrade) return;
      const rows = [["meule", "Meule"], ["roue", "Roue à mana"], ["atelier", "Atelier"]];
      rows.forEach(([k, n], row) => {
        for (let lv = 0; lv <= 3; lv++) {
          const u = M.millUpgrade(k, lv);
          const x = (lv - 1.5) * (k === "atelier" ? 8 : 6);
          const z = [-10, 0, 10][row];
          const api = { object: u.object, height: k === "roue" ? 3.6 : 3.2, update: u.update, dispose: u.dispose };
          if (k === "roue") {
            // Roue de démonstration (galerie) : rayon 1,5 m, largeur 1,1 m, axe X.
            const holder = new THREE.Group();
            holder.position.set(x, 1.75, z);
            const wheel = new THREE.Group();
            const wm = new THREE.MeshStandardMaterial({ color: PTMT.color("#6e4b2d"), roughness: 0.85 });
            for (const sx of [-0.52, 0.52]) {
              const rim = new THREE.Mesh(new THREE.TorusGeometry(1.45, 0.06, 6, 40), wm);
              rim.rotation.y = Math.PI / 2; rim.position.x = sx; rim.castShadow = true; wheel.add(rim);
            }
            for (let i = 0; i < 16; i++) {
              const a = (i / 16) * Math.PI * 2;
              const pad = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.34, 0.05), wm);
              pad.position.set(0, Math.cos(a) * 1.38, Math.sin(a) * 1.38); pad.rotation.x = a; pad.castShadow = true; wheel.add(pad);
            }
            for (let i = 0; i < 4; i++) {
              const sp = new THREE.Mesh(new THREE.BoxGeometry(1.0, 2.8, 0.1), wm);
              sp.rotation.x = (i / 4) * Math.PI; wheel.add(sp);
            }
            const axle = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 1.6, 12), wm); axle.rotation.z = Math.PI / 2; wheel.add(axle);
            wheel.add(u.object);
            holder.add(wheel);
            sectionGroup.add(holder);
            const it = { api: { object: holder, update: (dt, t) => { wheel.rotation.x -= dt * 0.6; u.update(dt, t); }, dispose: u.dispose }, kind: "mill" };
            items.push(it);
            addLabel(holder, n + " " + lv, null, 2.2);
          } else place(api, x, z, n + " " + lv, null, { kind: "mill" });
        }
      });
      return { center: [0, 0, 0], dist: 40, close: { center: [0, 0, -10], dist: 16, pitch: 24 } };
    }

    let layout = null;
    let current = null;
    function clearSection() {
      for (const it of items) if (it.api.dispose && !it.attached) it.api.dispose();
      items.length = 0;
      for (const l of labels) l.el.remove();
      labels.length = 0;
      if (sectionGroup) scene.remove(sectionGroup);
      sectionGroup = new THREE.Group();
      scene.add(sectionGroup);
    }
    function showSection(k) {
      clearSection();
      current = k;
      layout = SECTIONS[k].build() || { center: [0, 0, 0], dist: 30 };
      for (const b of sectionsEl.children) b.setAttribute("aria-pressed", String(b.dataset.section === k));
      applyView();
      applyToggles();
    }
    function applyView() {
      const L = layout;
      if (view.mode === "close" && L.close) {
        view.target.set(L.close.center[0], L.close.center[1] + 1, L.close.center[2]);
        view.dist = +(q.get("dist") || L.close.dist);
        view.pitch = +(q.get("pitch") || L.close.pitch || 22);
      } else {
        view.target.set(L.center[0], L.center[1], L.center[2]);
        view.dist = +(q.get("dist") || (view.mode === "aerial" ? 35 : L.dist));
        view.pitch = +(q.get("pitch") || 50);
      }
      if (q.get("tx")) view.target.set(+q.get("tx"), +(q.get("ty") || 0), +(q.get("tz") || 0));
      // Ombres cadrées sur la section.
      const s = 40;
      sun.position.set(view.target.x - 30, 55, view.target.z + 38);
      sun.target.position.copy(view.target);
      const c = sun.shadow.camera;
      c.left = -s; c.right = s; c.top = s; c.bottom = -s; c.near = 1; c.far = 200;
      c.updateProjectionMatrix();
    }
    function updateCamera() {
      const p = THREE.MathUtils.degToRad(view.pitch), y = THREE.MathUtils.degToRad(view.yaw);
      camera.position.set(view.target.x + Math.sin(y) * Math.cos(p) * view.dist, view.target.y + Math.sin(p) * view.dist, view.target.z + Math.cos(y) * Math.cos(p) * view.dist);
      camera.lookAt(view.target);
    }

    // Commandes.
    function forTowers(f) { for (const it of items) if (it.kind === "tower") f(it); }
    function fireAll() {
      forTowers((it) => it.api.trigger("windup"));
      setTimeout(() => forTowers((it) => it.api.trigger("fire")), 320);
    }
    function evolve(it) {
      it.evo = (it.evo + 1) % EVO.length;
      const [t, b] = EVO[it.evo];
      const pos = it.api.object.position.clone();
      const idx = labels.findIndex((l) => l.obj === it.api.object);
      it.api.dispose();
      it.api = M.tower(it.fam, t, b);
      it.api.object.position.copy(pos);
      sectionGroup.add(it.api.object);
      if (idx >= 0) { labels[idx].obj = it.api.object; labels[idx].y = it.api.height + 0.5; labels[idx].el.innerHTML = "Évolution " + FAM[it.fam] + "<small>" + TNAME[it.fam + t + (b || "")] + "</small>"; }
      it.api.setSelected(state.sel);
      it.api.setFrenzy(state.frenzy);
      it.api.trigger("upgrade");
    }
    function applyToggles() {
      for (const it of items) {
        const a = it.api;
        if (it.kind === "tower") { a.setSelected(state.sel); a.setFrenzy(state.frenzy); }
        if (it.kind === "trap") { a.setReady(!state.unready); a.setSelected && a.setSelected(state.sel); }
        if (it.kind === "chest" && it.row === 0 && a.setSelected) a.setSelected(state.sel);
      }
      document.body.classList.toggle("nolabels", !state.labels);
      for (const b of document.querySelectorAll("[data-toggle]")) b.setAttribute("aria-pressed", String(!!state[b.dataset.toggle]));
    }
    const actions = {
      w: () => forTowers((it) => it.api.trigger("windup")),
      f: fireAll,
      p: () => forTowers((it) => it.api.trigger("pulse")),
      u: () => forTowers((it) => it.api.trigger("upgrade")),
      n: () => forTowers((it) => { if (it.evo !== undefined) evolve(it); }),
      a: () => { state.auto = !state.auto; },
      s: () => { state.sel = !state.sel; },
      z: () => { state.frenzy = !state.frenzy; },
      y: () => { state.sweep = !state.sweep; if (!state.sweep) forTowers((it) => it.api.aim(0)); },
      t: () => { for (const it of items) if (it.kind === "trap") it.api.trigger("fire"); },
      r: () => { state.unready = !state.unready; },
      o: () => { state.open = state.open > 0.5 ? 0 : 1; },
      k: () => { state.stock = (state.stock + 3) % 4; for (const it of items) if (it.kind === "chest") it.api.setStock(state.stock, 3); },
      l: () => { state.alarm = !state.alarm; for (const it of items) if (it.kind === "chest") it.api.alarm(state.alarm); },
      c: () => { state.sockState = (state.sockState + 1) % 5; for (const it of items) if (it.kind === "socket") it.api.setState(state.sockState === 4 ? SOCK[it.sock] : SOCK[state.sockState]); },
      v: () => { view.mode = view.mode === "aerial" ? "close" : view.mode === "close" ? "orbit" : "aerial"; applyView(); },
      b: () => { state.labels = !state.labels; },
      h: () => document.getElementById("ui").classList.toggle("hidden"),
    };
    function act(k) { if (actions[k]) { actions[k](); applyToggles(); } }
    for (const b of document.querySelectorAll("#ui [data-k]")) b.onclick = () => act(b.dataset.k);
    addEventListener("keydown", (e) => {
      const k = e.key.toLowerCase();
      if (k >= "1" && k <= "6") return showSection(Object.keys(SECTIONS)[+k - 1]);
      act(k);
    });
    // Orbite à la souris / au doigt.
    let drag = null;
    renderer.domElement.addEventListener("pointerdown", (e) => { drag = { x: e.clientX, y: e.clientY, b: e.button, shift: e.shiftKey }; renderer.domElement.setPointerCapture(e.pointerId); });
    renderer.domElement.addEventListener("pointermove", (e) => {
      if (!drag) return;
      const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
      drag.x = e.clientX; drag.y = e.clientY;
      if (drag.b === 2 || drag.shift) {
        const y = THREE.MathUtils.degToRad(view.yaw), k = view.dist * 0.0022;
        view.target.x -= (Math.cos(y) * dx) * k - Math.sin(y) * dy * k;
        view.target.z -= (-Math.sin(y) * dx) * k - Math.cos(y) * dy * k;
      } else { view.yaw -= dx * 0.3; view.pitch = Math.max(5, Math.min(88, view.pitch + dy * 0.25)); }
    });
    addEventListener("pointerup", () => { drag = null; });
    renderer.domElement.addEventListener("contextmenu", (e) => e.preventDefault());
    renderer.domElement.addEventListener("wheel", (e) => { view.dist = Math.max(3, Math.min(160, view.dist * Math.exp(e.deltaY * 0.001))); }, { passive: true });
    addEventListener("resize", () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });

    const statsEl = document.getElementById("stats");
    const clock = new THREE.Clock();
    let autoT = 0, frames = 0, fpsT = 0, fps = 0;
    const v3 = new THREE.Vector3();
    const speed = +(q.get("speed") || 1);
    function frame() {
      requestAnimationFrame(frame);
      const dt = Math.min(0.1, clock.getDelta()) * speed;
      state.time += dt;
      const time = state.time;
      if (state.auto) {
        autoT += dt;
        for (const it of items) {
          if (it.kind !== "tower") continue;
          it.cd = (it.cd === undefined ? Math.random() * 2 : it.cd) - dt;
          if (it.cd <= 0) {
            const continuous = it.api.branch === "A" && it.api.tier === 2;
            if (continuous) { it.api.trigger("pulse"); it.cd = 0.35; it.burst = (it.burst || 0) + 1; if (it.burst > 6) { it.burst = 0; it.cd = 1.6; } }
            else { it.api.trigger("windup"); it.pending = 0.32; it.cd = 2.2 + Math.random(); }
          }
          if (it.pending !== undefined) { it.pending -= dt; if (it.pending <= 0) { it.api.trigger("fire"); it.pending = undefined; } }
        }
      }
      if (state.sweep) forTowers((it) => it.api.aim(Math.sin(time * 0.7 + it.api.object.position.x * 0.2) * 1.6));
      for (const it of items) {
        const a = it.api;
        if (it.kind === "chest" && it.row === 0) a.setOpenProgress && a.setOpenProgress(THREE.MathUtils.lerp(it.op || 0, state.open, 0.08)), (it.op = THREE.MathUtils.lerp(it.op || 0, state.open, 0.08));
        if (a.update) a.update(dt, time);
      }
      updateCamera();
      renderer.render(scene, camera);
      // Étiquettes.
      if (state.labels) for (const l of labels) {
        v3.set(0, l.y, 0);
        l.obj.localToWorld(v3);
        v3.project(camera);
        const vis = v3.z < 1 && Math.abs(v3.x) < 1.1 && Math.abs(v3.y) < 1.1;
        l.el.style.display = vis ? "" : "none";
        if (vis) l.el.style.transform = `translate(${((v3.x + 1) / 2) * innerWidth}px, ${((1 - v3.y) / 2) * innerHeight}px) translate(-50%, -100%)`;
      }
      frames++; fpsT += clock.elapsedTime - (fpsT ? 0 : 0);
      if (frames % 20 === 0) {
        const r = renderer.info.render;
        statsEl.textContent = `${SECTIONS[current] ? SECTIONS[current].name : ""} · ${r.calls} appels · ${r.triangles.toLocaleString("fr-FR")} triangles · vue ${view.mode}`;
      }
    }

    // API de test (outil de capture).
    window.G = {
      THREE, scene, renderer, camera, items, state, view, act, showSection,
      stats() {
        return items.map((it) => ({ label: it.label || it.key, tris: K.visibleTriangles(it.api.object), all: K.triangles(it.api.object), meshes: countMeshes(it.api.object), height: it.api.height }));
      },
      info() { return Object.assign({}, renderer.info.render, { programs: renderer.info.programs.length, geometries: renderer.info.memory.geometries, textures: renderer.info.memory.textures }); },
      /** Détail des triangles visibles par maillage (filtre sur l'étiquette). */
      breakdown(filter) {
        const out = {};
        for (const it of items) {
          if (!it.label || (filter && it.label.indexOf(filter) < 0)) continue;
          const rows = [];
          (function walk(o, path) {
            if (!o.visible) return;
            if (o.isMesh) {
              const g = o.geometry;
              rows.push(path + "/" + o.name + ":" + (g.index ? g.index.count : g.attributes.position.count) / 3);
            }
            o.children.forEach((c, i) => walk(c, path + "." + i));
          })(it.api.object, "");
          out[it.label] = rows.join(" ");
        }
        return out;
      },
      set(k, v) { state[k] = v; applyToggles(); },
    };
    function countMeshes(o) { let n = 0; o.traverse((c) => { if (c.isMesh || c.isSprite) n++; }); return n; }

    const sec = q.get("section") || "tours";
    showSection(SECTIONS[sec] ? sec : "tours");
    if (q.get("sel") === "1") act("s");
    if (q.get("frenzy") === "1") act("z");
    if (q.get("auto") === "1") act("a");
    if (q.get("labels") === "0") { state.labels = false; applyToggles(); }
    if (q.get("ui") === "0") document.getElementById("ui").style.display = "none";
    frame();
  }
})();
</script>
</body>
</html>
