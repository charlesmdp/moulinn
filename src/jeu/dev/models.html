<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pas touche à mes trésors · galerie des tours</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #9dbbdc; font: 13px/1.3 system-ui, -apple-system, "Segoe UI", sans-serif; color: #1d2a1a; }
  canvas { display: block; touch-action: none; }
  #ui { position: fixed; left: 8px; top: 8px; max-width: min(620px, calc(100vw - 16px)); display: flex; flex-direction: column; gap: 5px; z-index: 5; }
  #ui .row { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  #ui button { font: inherit; border: 0; border-radius: 9px; padding: 5px 9px; background: #fff7e6; color: #3b2a14; box-shadow: 0 2px 0 #c9a86a, 0 3px 8px rgba(0,0,0,.18); cursor: pointer; }
  #ui button[aria-pressed="true"] { background: #7fae4b; color: #fff; box-shadow: 0 2px 0 #4f7a26, 0 3px 8px rgba(0,0,0,.2); }
  #ui .title { font-weight: 700; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.55); margin-right: 6px; }
  #ui.hidden .row:not(:first-child) { display: none; }
  #stats { position: fixed; right: 8px; bottom: 8px; color: #fff; text-shadow: 0 1px 2px #000; font: 11px/1.35 ui-monospace, monospace; text-align: right; white-space: pre; pointer-events: none; }
  .lbl { position: fixed; left: 0; top: 0; transform: translate(-50%, -100%); color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.85), 0 0 6px rgba(0,0,0,.4); font-weight: 650; font-size: 11px; white-space: nowrap; pointer-events: none; will-change: transform; text-align: center; }
  .lbl small { display: block; font-weight: 500; opacity: .85; }
  body.nolabels .lbl { display: none; }
</style>
</head>
<body>
<div id="ui">
  <div class="row"><span class="title">Pas touche à mes trésors · tours</span><button data-k="h" title="Masquer/afficher (H)">☰</button></div>
  <div class="row" id="sections"></div>
  <div class="row"><button data-k="f">Tir (F)</button><button data-k="p">Projectiles (P)</button><button data-k="a" data-toggle="auto">Tir auto (A)</button><button data-k="y" data-toggle="sweep">Visée tournante (Y)</button><button data-k="t" data-toggle="track">Suivre les cibles (T)</button></div>
  <div class="row"><button data-k="z" data-toggle="frenzy">Frénésie (Z)</button><button data-k="s" data-toggle="sel">Sélection (S)</button><button data-k="u">Montée de niveau (U)</button><button data-k="n">Niveau suivant (N)</button><button data-k="v">Vue (V)</button><button data-k="b" data-toggle="labels">Étiquettes (B)</button></div>
</div>
<div id="stats"></div>
<script>
"use strict";
(function () {
  const q = new URLSearchParams(location.search);
  const files = [
    "../../static/assets/engine-0.40e246fcf208.js",
    "../vendor/BufferGeometryUtils.js",
    "../core/00-ptmt.js",
    "../sim/00-data.js",
    "../models/10-kit.js",
    "../models/20-boar.js",
    "../models/21-swan.js",
    "../models/22-dog.js",
    "../fx/05-kit.js",
    "../fx/10-fx.js",
    "../fx/11-areas.js",
    "../fx/12-props.js",
    "../fx/13-shots.js",
  ];
  (function load(i) {
    if (i >= files.length) return start();
    const s = document.createElement("script");
    s.src = files[i];
    s.onload = () => load(i + 1);
    s.onerror = () => { console.warn("galerie : fichier absent " + files[i]); load(i + 1); };
    document.head.appendChild(s);
  })(0);

  function start() {
    const PTMT = globalThis.PTMT, M = PTMT.models, K = M.kit, DATA = PTMT.sim && PTMT.sim.DATA;
    const TILE = 3.6;
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 0.95;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = PTMT.color("#a9cbe3");
    const hemi = new THREE.HemisphereLight(PTMT.color("#cfe3ff"), PTMT.color("#5b6b3a"), 0.62);
    scene.add(hemi);
    const sun = new THREE.DirectionalLight(PTMT.color("#fff1d6"), 1.75);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.bias = -0.0004;
    sun.shadow.normalBias = 0.04;
    scene.add(sun, sun.target);

    // Cases de terrain factices (herbe, eau, roche, chemin) : repères d'échelle.
    function canvasTex(draw, rep) {
      const c = document.createElement("canvas"); c.width = c.height = 256;
      draw(c.getContext("2d"));
      const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 4;
      if (rep) t.repeat.set(rep, rep);
      return t;
    }
    const nz = K.noise;
    function noisy(g, base, amp, seed) {
      const img = g.createImageData(256, 256);
      for (let y = 0; y < 256; y++) for (let x = 0; x < 256; x++) {
        const n = nz.fbm(x / 256, y / 256, 4, seed, 4), h = nz.hash2(x, y, seed + 3);
        const i = (y * 256 + x) * 4;
        for (let k = 0; k < 3; k++) img.data[i + k] = Math.max(0, Math.min(255, base[k] + (n - 0.5) * amp[k] + (h - 0.5) * amp[k] * 0.4));
        img.data[i + 3] = 255;
      }
      g.putImageData(img, 0, 0);
    }
    const TEX = {
      grass: canvasTex((g) => noisy(g, [96, 150, 58], [60, 70, 40], 3)),
      road: canvasTex((g) => noisy(g, [196, 164, 112], [50, 44, 36], 5)),
      rock: canvasTex((g) => { noisy(g, [132, 124, 118], [60, 56, 54], 9); g.strokeStyle = "#ff8a2a"; g.lineWidth = 2; for (let i = 0; i < 7; i++) { g.beginPath(); let x = Math.random() * 256, y = Math.random() * 256; g.moveTo(x, y); for (let k = 0; k < 5; k++) { x += (Math.random() - 0.5) * 50; y += (Math.random() - 0.5) * 50; g.lineTo(x, y); } g.stroke(); } }),
      water: canvasTex((g) => noisy(g, [46, 132, 170], [30, 40, 40], 13)),
    };
    const MAT = {
      grass: new THREE.MeshStandardMaterial({ map: TEX.grass, roughness: 0.95 }),
      road: new THREE.MeshStandardMaterial({ map: TEX.road, roughness: 0.95 }),
      rock: new THREE.MeshStandardMaterial({ map: TEX.rock, roughness: 0.9 }),
      water: new THREE.MeshStandardMaterial({ map: TEX.water, roughness: 0.12, metalness: 0.1, transparent: true, opacity: 0.88 }),
      bed: new THREE.MeshStandardMaterial({ color: PTMT.color("#4a5a3a"), roughness: 1 }),
      cliff: new THREE.MeshStandardMaterial({ color: PTMT.color("#8a7458"), roughness: 1 }),
    };
    const TERRAIN = { boar: "grass", swan: "water", dog: "rock" };
    const TOP = { road: 0, grass: 0.45, rock: 0.45, water: -0.25, high: 1.3 };
    /** Une case (i, j) de terrain à la position (x, z) ; renvoie la hauteur du dessus. */
    function tile(parent, kind, x, z, base) {
      base = base === undefined ? -0.6 : base;
      const top = TOP[kind];
      if (kind === "water") {
        const bed = new THREE.Mesh(new THREE.BoxGeometry(TILE, 0.1, TILE), MAT.bed);
        bed.position.set(x, -0.9, z); bed.receiveShadow = true; parent.add(bed);
        const w = new THREE.Mesh(new THREE.PlaneGeometry(TILE, TILE), MAT.water);
        w.rotation.x = -Math.PI / 2; w.position.set(x, top, z); w.receiveShadow = true; parent.add(w);
        return top;
      }
      const h = top - base;
      const m = new THREE.Mesh(new THREE.BoxGeometry(TILE, h, TILE), [MAT.cliff, MAT.cliff, MAT[kind === "high" ? "grass" : kind], MAT.cliff, MAT.cliff, MAT.cliff]);
      m.position.set(x, base + h / 2, z); m.receiveShadow = true; m.castShadow = kind !== "road"; parent.add(m);
      return top;
    }

    // Ennemi factice (échelle : ≈ 2,2 m) qui marche le long d'un chemin.
    function dummy(color) {
      const g = new THREE.Group();
      const m = new THREE.MeshStandardMaterial({ color: PTMT.color(color || "#c9c2b5"), roughness: 0.7 });
      const body = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.36, 1.1, 12), m); body.position.y = 0.6; body.castShadow = true;
      const head = new THREE.Mesh(new THREE.SphereGeometry(0.45, 14, 10), new THREE.MeshStandardMaterial({ color: PTMT.color("#f0c8a0"), roughness: 0.7 })); head.position.y = 1.6; head.castShadow = true;
      const hat = new THREE.Mesh(new THREE.CylinderGeometry(0.32, 0.5, 0.25, 12), m); hat.position.y = 1.95;
      g.add(body, head, hat);
      return g;
    }

    const items = []; // tours
    const walkers = []; // cibles
    const shots = []; // projectiles en vol
    const labels = [];
    let root = null;
    const state = { auto: q.get("auto") === "1", sel: false, frenzy: false, sweep: false, track: true, labels: q.get("labels") !== "0", time: 0 };
    const view = { mode: q.get("view") || "jeu", yaw: +(q.get("yaw") || 0), pitch: +(q.get("pitch") || 60), px: +(q.get("px") || 46), dist: 30, target: new THREE.Vector3() };
    const FAMS = { boar: "Sanglier", swan: "Cygne", dog: "Berger" };
    const LEVELS = [[1, null], [2, null], [3, null], [4, "A"], [5, "A"], [6, "A"], [7, "A"], [4, "B"], [5, "B"], [6, "B"], [7, "B"]];
    const EVO = [[1, null], [2, null], [3, null], [4, "A"], [5, "A"], [6, "A"], [7, "A"], [1, null], [2, null], [3, null], [4, "B"], [5, "B"], [6, "B"], [7, "B"]];
    function levelName(f, lv, sp) {
      const d = DATA && DATA.towerLevel(f, lv, sp);
      return d ? d.name : f + " " + lv + (sp || "");
    }

    function addLabel(obj, text, sub, y) {
      const el = document.createElement("div");
      el.className = "lbl";
      el.innerHTML = text + (sub ? "<small>" + sub + "</small>" : "");
      document.body.appendChild(el);
      labels.push({ el, obj, y });
      return labels[labels.length - 1];
    }
    function place(family, lv, sp, x, z, y, extra) {
      const api = M.ctTower(family, lv, sp, { terrain: extra && extra.terrain });
      api.object.position.set(x, y, z);
      root.add(api.object);
      const it = Object.assign({ api, family, lv, sp, x, z, y, cd: Math.random() * 1.5 }, extra || {});
      it.label = addLabel(api.object, levelName(family, lv, sp), (sp ? sp : "") + lv + " · " + api.height.toFixed(2) + " m", api.height + 0.45);
      items.push(it);
      return it;
    }
    function rebuild(it, lv, sp) {
      const pos = it.api.object.position.clone();
      it.api.dispose();
      it.api = M.ctTower(it.family, lv, sp, { terrain: it.terrain });
      it.api.object.position.copy(pos);
      root.add(it.api.object);
      it.lv = lv; it.sp = sp;
      it.label.obj = it.api.object; it.label.y = it.api.height + 0.45;
      it.label.el.innerHTML = levelName(it.family, lv, sp) + "<small>" + (sp || "") + lv + " · " + it.api.height.toFixed(2) + " m</small>";
      it.api.setSelected(state.sel); it.api.setFrenzy(state.frenzy);
      it.api.celebrate();
    }

    /** Section d'une famille : grille 4 × 3 (1-3 + évolution, A4-A7, B4-B7) le long d'un chemin avec des cibles. */
    function buildFamily(f) {
      const kind = TERRAIN[f];
      const cols = [-1.5, -0.5, 0.5, 1.5].map((c) => c * (TILE + 0.9));
      const rows = [-2 * (TILE + 0.9), -(TILE + 0.9), 0];
      const layout = [
        [[1, null], [2, null], [3, null], "evo"],
        [[4, "A"], [5, "A"], [6, "A"], [7, "A"]],
        [[4, "B"], [5, "B"], [6, "B"], [7, "B"]],
      ];
      layout.forEach((row, r) => row.forEach((cell, c) => {
        const x = cols[c], z = rows[r];
        const y = tile(root, kind, x, z) - (kind === "water" ? 0 : 0);
        if (cell === "evo") { const it = place(f, 1, null, x, z, y, { evo: 0, terrain: kind }); it.label.el.innerHTML = "Évolution<small>N : niveau suivant</small>"; }
        else place(f, cell[0], cell[1], x, z, y, { terrain: kind });
      }));
      // Chemin et cibles devant la grille.
      for (let i = -3; i <= 3; i++) tile(root, "road", i * TILE, TILE * 1.4, -0.6);
      for (let i = 0; i < 3; i++) walkers.push(makeWalker(-11 + i * 7.5, TILE * 1.4, 0, 1.4 + i * 0.2, ["#c8433a", "#3a7ad8", "#e0b020"][i]));
      return { center: [0, 0.8, -1.5], width: 34 };
    }
    function makeWalker(x, z, y, speed, color) {
      const d = dummy(color);
      d.position.set(x, y, z);
      root.add(d);
      return { obj: d, x0: -12, x1: 12, speed, y, z, phase: Math.random() * 6 };
    }
    /** Toutes les familles côte à côte. */
    function buildAll() {
      const fams = ["boar", "swan", "dog"];
      fams.forEach((f, r) => {
        LEVELS.forEach(([lv, sp], c) => {
          const x = (c - 5) * (TILE + 0.4), z = (r - 1) * (TILE + 1.6);
          const y = tile(root, TERRAIN[f], x, z);
          place(f, lv, sp, x, z, y, { terrain: TERRAIN[f] });
        });
      });
      for (let i = -6; i <= 6; i++) tile(root, "road", i * TILE, 2 * (TILE + 1.6) - 0.6, -0.6);
      for (let i = 0; i < 4; i++) walkers.push(makeWalker(-20 + i * 11, 2 * (TILE + 1.6) - 0.6, 0, 1.6, ["#c8433a", "#3a7ad8", "#e0b020", "#7a4ab8"][i]));
      walkers.forEach((w) => { w.x0 = -22; w.x1 = 22; });
      return { center: [0, 0.8, 1], width: 48 };
    }
    /** Petit plateau façon jeu : chemin en S, herbe, eau, roche, butte ; tours de tous niveaux. */
    function buildBoard() {
      const map = [
        "....~~~~^^^^",
        ".b.~~s~^^d^.",
        "######~######",
        "..b.#.~~.^^#",
        ".b..#~s~^d^#",
        "....#~~~^^^#",
        "#####..######",
      ];
      const W = 12, H = map.length;
      const towers = { "1,1": ["boar", 3, null], "5,1": ["swan", 2, null], "9,1": ["dog", 5, "A"], "2,3": ["boar", 7, "B"], "1,4": ["boar", 5, "A"], "6,4": ["swan", 6, "B"], "9,4": ["dog", 7, "B"] };
      const path = [];
      for (let j = 0; j < H; j++) for (let i = 0; i < W; i++) {
        let ch = map[j][i] || ".";
        const x = (i - W / 2 + 0.5) * TILE, z = (j - H / 2 + 0.5) * TILE;
        let kind = ch === "#" ? "road" : ch === "~" || ch === "s" ? "water" : ch === "^" || ch === "d" ? "rock" : "grass";
        const y = tile(root, kind, x, z);
        const tw = towers[i + "," + j];
        if (tw) place(tw[0], tw[1], tw[2], x, z, y, { terrain: kind });
      }
      // Chemin parcouru par les cibles (rangée 2 puis colonne 4, rangée 6, colonne 11).
      const P = (i, j) => [(i - W / 2 + 0.5) * TILE, (j - H / 2 + 0.5) * TILE];
      const route = [P(-1, 2), P(4, 2), P(4, 6), P(11, 6), P(11, 3), P(12, 2)];
      for (let i = 0; i < 5; i++) {
        const d = dummy(["#c8433a", "#3a7ad8", "#e0b020", "#7a4ab8", "#3aa860"][i]);
        root.add(d);
        walkers.push({ obj: d, route, s: i * 7, speed: 1.3 + i * 0.1, y: 0 });
      }
      return { center: [0, 0, 0], width: W * TILE + 2 };
    }
    /** Laboratoire des projectiles : chaque sorte tirée en boucle entre deux poteaux. */
    const PROJ = ["chestnut", "bigChestnut", "waterJet", "iceShard", "darkWater", "fireball", "dragonFire", "blueFire"];
    const SPLASH = { chestnut: 0, bigChestnut: 1.0, waterJet: 0.55, iceShard: 0.6, darkWater: 0.7, fireball: 0, dragonFire: 0.9, blueFire: 0 };
    function buildLab() {
      PROJ.forEach((kind, i) => {
        const z = (i - 3.5) * 3.2;
        for (let k = -2; k <= 2; k++) tile(root, k === 2 ? "road" : "grass", k * TILE, z, -0.6);
        const post = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.25, 1.6, 8), MAT.cliff); post.position.set(-7.2, 0.45 + 0.8, z); post.castShadow = true; root.add(post);
        const d = dummy(["#c8433a", "#3a7ad8", "#e0b020", "#7a4ab8", "#3aa860", "#c8433a", "#3a7ad8", "#e0b020"][i]);
        d.position.set(7.2, 0, z); root.add(d);
        const el = addLabel(post, kind, null, 2.2);
        labs.push({ kind, from: new THREE.Vector3(-7.2, 2.1, z), to: new THREE.Vector3(7.2, 1.1, z), t: i * 0.13, period: kind === "bigChestnut" ? 1.9 : 1.2, h: null });
        void el;
      });
      return { center: [0, 0, 0], width: 24 };
    }
    const labs = [];

    const SECTIONS = {
      boar: { name: "Sangliers", build: () => buildFamily("boar") },
      swan: { name: "Cygnes", build: () => buildFamily("swan") },
      dog: { name: "Bergers", build: () => buildFamily("dog") },
      tout: { name: "Toutes", build: buildAll },
      jeu: { name: "Plateau", build: buildBoard },
      tirs: { name: "Projectiles", build: buildLab },
      solo: { name: "Solo", build: buildSolo },
    };
    /** ?section=solo&solo=boar:7:A[:terrain] */
    function buildSolo() {
      const a = (q.get("solo") || "boar:1").split(":");
      const f = a[0], lv = +a[1] || 1, sp = a[2] || null, kind = a[3] || TERRAIN[f];
      const y = tile(root, kind, 0, 0);
      place(f, lv, sp === "-" ? null : sp, 0, 0, y, { terrain: kind });
      for (let i = -1; i <= 1; i++) if (i) tile(root, kind, i * TILE, 0);
      for (let i = -1; i <= 1; i++) tile(root, "road", i * TILE, TILE, -0.6);
      walkers.push(makeWalker(-6, TILE, 0, 1.2, "#c8433a"));
      walkers[0].x0 = -6; walkers[0].x1 = 6;
      return { center: [0, 1, 0], width: 3 * TILE };
    }
    const sectionsEl = document.getElementById("sections");
    for (const [k, s] of Object.entries(SECTIONS)) {
      if (k === "solo") continue;
      const b = document.createElement("button");
      b.textContent = s.name; b.dataset.section = k; b.onclick = () => showSection(k);
      sectionsEl.appendChild(b);
    }

    let layout = null, current = null;
    function clearSection() {
      for (const it of items) it.api.dispose();
      items.length = 0;
      for (const s of shots) s.p.release();
      shots.length = 0;
      for (const l of labs) if (l.h) l.h.release();
      labs.length = 0;
      walkers.length = 0;
      for (const l of labels) l.el.remove();
      labels.length = 0;
      if (root) scene.remove(root);
      root = new THREE.Group();
      scene.add(root);
    }
    function showSection(k) {
      clearSection();
      current = k;
      layout = SECTIONS[k].build();
      for (const b of sectionsEl.children) b.setAttribute("aria-pressed", String(b.dataset.section === k));
      applyView();
      applyToggles();
    }

    // Caméras : « jeu » = orthographique inclinée (≈ 60°, px par case réglable), « proche » = perspective.
    const persp = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.1, 600);
    const ortho = new THREE.OrthographicCamera(-10, 10, 10, -10, 0.1, 600);
    let camera = ortho;
    function applyView() {
      const L = layout;
      view.target.set(L.center[0], L.center[1], L.center[2]);
      if (q.get("tx") || q.get("tz")) view.target.set(+(q.get("tx") || 0), +(q.get("ty") || 0), +(q.get("tz") || 0));
      view.dist = +(q.get("dist") || Math.max(8, L.width * 1.1));
      if (!q.get("px") && view.mode === "jeu") view.px = Math.min(80, Math.max(30, innerWidth / (L.width / TILE)));
      const s = Math.max(20, L.width * 0.8);
      sun.position.set(view.target.x - 30, 55, view.target.z + 25);
      sun.target.position.copy(view.target);
      const c = sun.shadow.camera;
      c.left = -s; c.right = s; c.top = s; c.bottom = -s; c.near = 1; c.far = 200;
      c.updateProjectionMatrix();
    }
    function updateCamera() {
      const p = THREE.MathUtils.degToRad(view.pitch), y = THREE.MathUtils.degToRad(view.yaw);
      camera = view.mode === "jeu" ? ortho : persp;
      const d = view.mode === "jeu" ? 120 : view.dist;
      camera.position.set(view.target.x + Math.sin(y) * Math.cos(p) * d, view.target.y + Math.sin(p) * d, view.target.z + Math.cos(y) * Math.cos(p) * d);
      camera.lookAt(view.target);
      if (view.mode === "jeu") {
        const w = (innerWidth / view.px) * TILE, h = w * innerHeight / innerWidth;
        ortho.left = -w / 2; ortho.right = w / 2; ortho.top = h / 2; ortho.bottom = -h / 2; ortho.near = 1; ortho.far = 400;
        ortho.updateProjectionMatrix();
      } else { persp.aspect = innerWidth / innerHeight; persp.updateProjectionMatrix(); }
    }

    // Fx.
    const fxOK = !!(PTMT.fx && PTMT.fx.init);
    if (fxOK) PTMT.fx.init(scene, ortho, renderer, { mobile: q.has("mobile") });
    const hasKind = (k) => fxOK && PTMT.fx._ && PTMT.fx._.KINDS && PTMT.fx._.KINDS[k];

    // Tirs : la tour attaque, le projectile part de la bouche après le délai renvoyé, vole jusqu'à la cible.
    const _a = new THREE.Vector3(), _b = new THREE.Vector3(), _c = new THREE.Vector3();
    function nearestWalker(it) {
      let best = null, bd = 1e9;
      it.api.object.getWorldPosition(_a);
      for (const w of walkers) { const d = w.obj.position.distanceToSquared(_a); if (d < bd) { bd = d; best = w; } }
      return best;
    }
    function fire(it) {
      const delay = it.api.attack();
      const d = DATA && DATA.towerLevel(it.family, it.lv, it.sp);
      const kind = d ? d.shot : "fireball";
      const target = nearestWalker(it);
      setTimeout(() => launch(it, kind, d, target), delay * 1000);
    }
    function launch(it, kind, d, target) {
      if (!items.includes(it) || !fxOK) return;
      const k = hasKind(kind) ? kind : "fireball";
      const from = new THREE.Vector3();
      it.api.muzzle.getWorldPosition(from);
      const to = target ? target.obj.position.clone().add(new THREE.Vector3(0, 1.1, 0)) : from.clone().add(new THREE.Vector3(Math.sin(it.api.bones.yaw.rotation.y) * 8, -1, Math.cos(it.api.bones.yaw.rotation.y) * 8));
      const speed = (d ? d.speed : 8) * TILE * 0.55;
      const dist = from.distanceTo(to);
      const arc = k === "bigChestnut" ? Math.max(2.5, dist * 0.45) : k === "chestnut" ? dist * 0.08 : 0.2;
      shots.push({ p: PTMT.fx.projectile(k), kind: k, from, to, t: 0, T: Math.max(0.25, dist / speed), arc, splash: d && d.splash ? d.splash : SPLASH[k] || 0, target });
    }
    function stepShots(dt) {
      for (let i = shots.length - 1; i >= 0; i--) {
        const s = shots[i];
        s.t += dt;
        if (s.target) s.to.copy(s.target.obj.position).y += 1.1;
        const k = Math.min(1, s.t / s.T);
        const pos = (k2) => _c.copy(s.from).lerp(s.to, k2).setY(THREE.MathUtils.lerp(s.from.y, s.to.y, k2) + Math.sin(k2 * Math.PI) * s.arc);
        _a.copy(pos(k));
        _b.copy(pos(Math.min(1, k + 0.02))).sub(_a);
        if (_b.lengthSq() < 1e-8) _b.copy(s.to).sub(s.from);
        s.p.set(_a, _b);
        if (k >= 1) {
          s.p.release();
          shots.splice(i, 1);
          PTMT.fx.burst(s.kind + "Hit", _a.setY(s.to.y - 1.0), { radius: s.splash, crit: Math.random() < 0.25 });
        }
      }
    }
    function stepLabs(dt) {
      for (const l of labs) {
        l.t += dt;
        const k = (l.t % l.period) / l.period;
        if (!l.h || l.k > k) {
          if (l.h) { l.h.release(); PTMT.fx.burst(l.kind + "Hit", l.to.clone().setY(0.02), { radius: SPLASH[l.kind] || 0, crit: Math.random() < 0.3 }); }
          l.h = hasKind(l.kind) ? PTMT.fx.projectile(l.kind) : null;
        }
        l.k = k;
        if (!l.h) continue;
        const arc = l.kind === "bigChestnut" ? 4 : l.kind === "chestnut" ? 1 : 0.4;
        const pos = (k2) => _c.copy(l.from).lerp(l.to, k2).setY(THREE.MathUtils.lerp(l.from.y, l.to.y, k2) + Math.sin(k2 * Math.PI) * arc);
        _a.copy(pos(k)); _b.copy(pos(Math.min(1, k + 0.02))).sub(_a);
        l.h.set(_a, _b);
      }
    }

    // Commandes.
    function applyToggles() {
      for (const it of items) { it.api.setSelected(state.sel); it.api.setFrenzy(state.frenzy); }
      document.body.classList.toggle("nolabels", !state.labels);
      for (const b of document.querySelectorAll("[data-toggle]")) b.setAttribute("aria-pressed", String(!!state[b.dataset.toggle]));
    }
    const actions = {
      f: () => { for (const it of items) it.api.attack(); },
      p: () => { for (const it of items) fire(it); },
      a: () => { state.auto = !state.auto; },
      y: () => { state.sweep = !state.sweep; if (state.sweep) state.track = false; },
      t: () => { state.track = !state.track; if (state.track) state.sweep = false; if (!state.track) for (const it of items) it.api.aim(0); },
      z: () => { state.frenzy = !state.frenzy; },
      s: () => { state.sel = !state.sel; },
      u: () => { for (const it of items) it.api.celebrate(); },
      n: () => { for (const it of items) if (it.evo !== undefined) { it.evo = (it.evo + 1) % EVO.length; rebuild(it, EVO[it.evo][0], EVO[it.evo][1]); } },
      v: () => { view.mode = view.mode === "jeu" ? "proche" : "jeu"; applyView(); },
      b: () => { state.labels = !state.labels; },
      h: () => document.getElementById("ui").classList.toggle("hidden"),
    };
    function act(k) { if (actions[k]) { actions[k](); applyToggles(); } }
    for (const b of document.querySelectorAll("#ui [data-k]")) b.onclick = () => act(b.dataset.k);
    addEventListener("keydown", (e) => {
      const k = e.key.toLowerCase();
      const keys = Object.keys(SECTIONS).filter((n) => n !== "solo");
      if (k >= "1" && k <= String(keys.length)) return showSection(keys[+k - 1]);
      act(k);
    });
    // Orbite à la souris / au doigt (utile pour inspecter ; le jeu reste en vue fixe).
    let drag = null;
    renderer.domElement.addEventListener("pointerdown", (e) => { drag = { x: e.clientX, y: e.clientY, b: e.button, shift: e.shiftKey }; renderer.domElement.setPointerCapture(e.pointerId); });
    renderer.domElement.addEventListener("pointermove", (e) => {
      if (!drag) return;
      const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
      drag.x = e.clientX; drag.y = e.clientY;
      if (drag.b === 2 || drag.shift) {
        const y = THREE.MathUtils.degToRad(view.yaw), k = view.mode === "jeu" ? TILE / view.px : view.dist * 0.0022;
        view.target.x -= Math.cos(y) * dx * k + Math.sin(y) * dy * k;
        view.target.z -= -Math.sin(y) * dx * k + Math.cos(y) * dy * k;
      } else { view.yaw -= dx * 0.3; view.pitch = Math.max(5, Math.min(89, view.pitch + dy * 0.25)); }
    });
    addEventListener("pointerup", () => { drag = null; });
    renderer.domElement.addEventListener("contextmenu", (e) => e.preventDefault());
    renderer.domElement.addEventListener("wheel", (e) => {
      if (view.mode === "jeu") view.px = Math.max(12, Math.min(400, view.px * Math.exp(-e.deltaY * 0.001)));
      else view.dist = Math.max(2, Math.min(160, view.dist * Math.exp(e.deltaY * 0.001)));
    }, { passive: true });
    addEventListener("resize", () => { renderer.setSize(innerWidth, innerHeight); });

    const statsEl = document.getElementById("stats");
    const clock = new THREE.Clock();
    let frames = 0;
    const v3 = new THREE.Vector3();
    const speed = +(q.get("speed") || 1);
    const fixedDt = q.get("dt") ? +q.get("dt") : 0;
    function stepWalkers(dt) {
      for (const w of walkers) {
        if (w.route) {
          w.s += dt * w.speed;
          let s = w.s, i = 0;
          const R = w.route;
          let seg = 0;
          for (i = 0; i < R.length - 1; i++) { seg = Math.hypot(R[i + 1][0] - R[i][0], R[i + 1][1] - R[i][1]); if (s <= seg) break; s -= seg; }
          if (i >= R.length - 1) { w.s = 0; continue; }
          const k = s / seg;
          w.obj.position.set(THREE.MathUtils.lerp(R[i][0], R[i + 1][0], k), Math.abs(Math.sin(state.time * 8 + w.speed)) * 0.08, THREE.MathUtils.lerp(R[i][1], R[i + 1][1], k));
          w.obj.rotation.y = Math.atan2(R[i + 1][0] - R[i][0], R[i + 1][1] - R[i][1]);
        } else {
          w.obj.position.x += w.speed * dt;
          if (w.obj.position.x > w.x1) w.obj.position.x = w.x0;
          w.obj.position.y = w.y + Math.abs(Math.sin(state.time * 8 + w.phase)) * 0.08;
          w.obj.rotation.y = Math.PI / 2;
        }
      }
    }
    function frame() {
      requestAnimationFrame(frame);
      const dt = fixedDt || Math.min(0.1, clock.getDelta()) * speed;
      state.time += dt;
      const time = state.time;
      stepWalkers(dt);
      for (const it of items) {
        if (state.sweep) it.api.aim(Math.sin(time * 0.7 + it.x * 0.2) * 2.2);
        else if (state.track && walkers.length) {
          const w = nearestWalker(it);
          it.api.object.getWorldPosition(_a);
          it.api.aim(Math.atan2(w.obj.position.x - _a.x, w.obj.position.z - _a.z));
        }
        if (state.auto) {
          it.cd -= dt;
          if (it.cd <= 0) {
            const d = DATA && DATA.towerLevel(it.family, it.lv, it.sp);
            const rate = (d ? d.rate : 1) * (state.frenzy ? 2 : 1);
            it.cd = 1 / rate;
            fire(it);
          }
        }
        it.api.update(dt, time);
      }
      if (fxOK) { stepShots(dt); stepLabs(dt); PTMT.fx.update(dt, time); }
      updateCamera();
      renderer.render(scene, camera);
      if (state.labels) for (const l of labels) {
        v3.set(0, l.y, 0);
        l.obj.localToWorld(v3);
        v3.project(camera);
        const vis = v3.z < 1 && Math.abs(v3.x) < 1.1 && Math.abs(v3.y) < 1.1;
        l.el.style.display = vis ? "" : "none";
        if (vis) l.el.style.transform = `translate(${((v3.x + 1) / 2) * innerWidth}px, ${((1 - v3.y) / 2) * innerHeight}px) translate(-50%, -100%)`;
      }
      frames++;
      if (frames % 20 === 0) {
        const r = renderer.info.render;
        statsEl.textContent = `${SECTIONS[current].name} · ${r.calls} appels · ${r.triangles.toLocaleString("fr-FR")} triangles · vue ${view.mode}${view.mode === "jeu" ? " · " + Math.round(view.px) + " px/case" : ""}`;
      }
    }

    // API de test (outil de capture).
    window.G = {
      THREE, scene, renderer, items, state, view, act, showSection, walkers,
      get camera() { return camera; },
      stats() {
        return items.map((it) => Object.assign({ name: it.family + ":" + (it.sp || "") + it.lv, height: it.api.height }, it.api.stats(), { meshes: countMeshes(it.api.object) }));
      },
      info() { return Object.assign({}, renderer.info.render, { programs: renderer.info.programs.length, geometries: renderer.info.memory.geometries, textures: renderer.info.memory.textures }); },
      set(k, v) { state[k] = v; applyToggles(); },
      fire(filter) { for (const it of items) if (!filter || filter(it)) fire(it); },
      attack(filter) { for (const it of items) if (!filter || filter(it)) it.api.attack(); },
      aim(yaw) { state.track = false; state.sweep = false; for (const it of items) it.api.aim(yaw); },
      look(tx, ty, tz, px, pitch, yaw) { view.mode = "jeu"; view.target.set(tx, ty, tz); if (px) view.px = px; if (pitch) view.pitch = pitch; if (yaw !== undefined) view.yaw = yaw; },
      close(tx, ty, tz, dist, pitch, yaw) { view.mode = "proche"; view.target.set(tx, ty, tz); view.dist = dist; if (pitch) view.pitch = pitch; if (yaw !== undefined) view.yaw = yaw; },
    };
    function countMeshes(o) { let n = 0; o.traverse((c) => { if ((c.isMesh || c.isSprite) && c.visible) n++; }); return n; }

    const sec = q.get("solo") ? "solo" : q.get("section") || "boar";
    showSection(SECTIONS[sec] ? sec : "boar");
    if (q.get("sel") === "1") act("s");
    if (q.get("frenzy") === "1") act("z");
    if (q.get("track") === "0") act("t");
    if (q.get("labels") === "0") { state.labels = false; applyToggles(); }
    if (q.get("ui") === "0") document.getElementById("ui").style.display = "none";
    else if (innerWidth < 600) document.getElementById("ui").classList.add("hidden");
    frame();
  }
})();
</script>
</body>
</html>
