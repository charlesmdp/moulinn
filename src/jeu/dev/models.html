<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pas touche à mes trésors · galerie des tours</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #9dbbdc; font: 13px/1.3 system-ui, -apple-system, "Segoe UI", sans-serif; color: #1d2a1a; }
  canvas { display: block; touch-action: none; }
  #ui { position: fixed; left: 8px; top: 8px; max-width: min(680px, calc(100vw - 16px)); display: flex; flex-direction: column; gap: 5px; z-index: 5; }
  #ui .row { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  #ui button { font: inherit; border: 0; border-radius: 9px; padding: 5px 9px; background: #fff7e6; color: #3b2a14; box-shadow: 0 2px 0 #c9a86a, 0 3px 8px rgba(0,0,0,.18); cursor: pointer; }
  #ui button[aria-pressed="true"] { background: #7fae4b; color: #fff; box-shadow: 0 2px 0 #4f7a26, 0 3px 8px rgba(0,0,0,.2); }
  #ui .title { font-weight: 700; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.55); margin-right: 6px; }
  #ui.hidden .row:not(:first-child) { display: none; }
  #stats { position: fixed; right: 8px; bottom: 8px; color: #fff; text-shadow: 0 1px 2px #000; font: 11px/1.35 ui-monospace, monospace; text-align: right; white-space: pre; pointer-events: none; }
  .lbl { position: fixed; left: 0; top: 0; transform: translate(-50%, -100%); color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.85), 0 0 6px rgba(0,0,0,.4); font-weight: 650; font-size: 11px; white-space: nowrap; pointer-events: none; will-change: transform; text-align: center; }
  .lbl small { display: block; font-weight: 500; opacity: .85; }
  body.nolabels .lbl { display: none; }
</style>
</head>
<body>
<div id="ui">
  <div class="row"><span class="title">Pas touche à mes trésors · tours</span><button data-k="h" title="Masquer/afficher (H)">☰</button></div>
  <div class="row" id="sections"></div>
  <div class="row"><button data-k="a" data-toggle="auto">Attaques auto (A)</button><button data-k="f">Élan seul (F)</button><button data-k="y" data-toggle="sweep">Visée tournante (Y)</button><button data-k="t" data-toggle="track">Suivre les cibles (T)</button><button data-k="w" data-toggle="walk">Cibles en marche (W)</button></div>
  <div class="row"><button data-k="z" data-toggle="frenzy">Frénésie (Z)</button><button data-k="s" data-toggle="sel">Sélection (S)</button><button data-k="e" data-toggle="dazzle">Ébloui (E)</button><button data-k="u">Montée de niveau (U)</button><button data-k="n">Niveau suivant (N)</button><button data-k="v">Vue (V)</button><button data-k="b" data-toggle="labels">Étiquettes (B)</button></div>
</div>
<div id="stats"></div>
<script>
"use strict";
// Galerie des tours (sanglier, cygne, berger-dragon) et de leurs attaques :
//  - sanglier : tir à la suite (élan, bogue de châtaigne ; Grand Solitaire : deux bogues sur deux cibles) ;
//  - cygne : réserve de boules (setCharges) lâchée en rafale puis rechargée une à une ;
//  - berger, dragon : jet continu (setBeam + PTMT.fx.beam) qui chauffe tant que la cible reste à portée.
// Paramètres d'URL : section, solo=famille:niveau[:spé[:terrain]], px (pixels par case en vue de jeu),
// view=jeu|proche, labels=0, ui=0, auto=0|1, track=0, walk=0, mobile, n (tours de la partie), dt, speed.
(function () {
  const q = new URLSearchParams(location.search);
  const files = [
    "../../static/assets/engine-0.40e246fcf208.js",
    "../vendor/BufferGeometryUtils.js",
    "../core/00-ptmt.js",
    "../sim/00-data.js",
    "../models/10-kit.js",
    "../models/20-boar.js",
    "../models/21-swan.js",
    "../models/22-dog.js",
    "../fx/05-kit.js",
    "../fx/10-fx.js",
    "../fx/11-areas.js",
    "../fx/12-props.js",
    "../fx/13-shots.js",
  ];
  (function load(i) {
    if (i >= files.length) return start();
    const s = document.createElement("script");
    s.src = files[i];
    s.onload = () => load(i + 1);
    s.onerror = () => { console.warn("galerie : fichier absent " + files[i]); load(i + 1); };
    document.head.appendChild(s);
  })(0);

  function start() {
    const PTMT = globalThis.PTMT, M = PTMT.models, K = M.kit, DATA = PTMT.sim && PTMT.sim.DATA;
    const TILE = 3.6;
    // ?mobile : qualité téléphone (lueurs dans la passe opaque, sans ombres ni rides : 1 appel de dessin par tour).
    if (q.has("mobile") && M.ctConfig) M.ctConfig({ mobile: true });
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 0.95;
    renderer.shadowMap.enabled = !q.has("mobile");
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);
    // Appels de la passe d'ombre : renderer.info.render.calls est remis à zéro juste après elle, on les compte à part.
    let shadowCalls = 0;
    const smRender = renderer.shadowMap.render;
    renderer.shadowMap.render = function (lights, sc, cam) {
      const c0 = renderer.info.render.calls;
      smRender.call(this, lights, sc, cam);
      shadowCalls = renderer.info.render.calls - c0;
    };

    const scene = new THREE.Scene();
    scene.background = PTMT.color("#a9cbe3");
    const hemi = new THREE.HemisphereLight(PTMT.color("#cfe3ff"), PTMT.color("#5b6b3a"), 0.62);
    scene.add(hemi);
    const sun = new THREE.DirectionalLight(PTMT.color("#fff1d6"), 1.75);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.bias = -0.0004;
    sun.shadow.normalBias = 0.04;
    scene.add(sun, sun.target);

    // Cases de terrain factices (herbe, eau, roche, chemin) : repères d'échelle.
    function canvasTex(draw, rep) {
      const c = document.createElement("canvas"); c.width = c.height = 256;
      draw(c.getContext("2d"));
      const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 4;
      if (rep) t.repeat.set(rep, rep);
      return t;
    }
    const nz = K.noise;
    function noisy(g, base, amp, seed) {
      const img = g.createImageData(256, 256);
      for (let y = 0; y < 256; y++) for (let x = 0; x < 256; x++) {
        const n = nz.fbm(x / 256, y / 256, 4, seed, 4), h = nz.hash2(x, y, seed + 3);
        const i = (y * 256 + x) * 4;
        for (let k = 0; k < 3; k++) img.data[i + k] = Math.max(0, Math.min(255, base[k] + (n - 0.5) * amp[k] + (h - 0.5) * amp[k] * 0.4));
        img.data[i + 3] = 255;
      }
      g.putImageData(img, 0, 0);
    }
    const TEX = {
      grass: canvasTex((g) => noisy(g, [96, 150, 58], [60, 70, 40], 3)),
      road: canvasTex((g) => noisy(g, [196, 164, 112], [50, 44, 36], 5)),
      rock: canvasTex((g) => noisy(g, [132, 124, 118], [60, 56, 54], 9)),
      water: canvasTex((g) => noisy(g, [40, 120, 160], [26, 36, 36], 13)),
    };
    const MAT = {
      grass: new THREE.MeshStandardMaterial({ map: TEX.grass, roughness: 0.95 }),
      road: new THREE.MeshStandardMaterial({ map: TEX.road, roughness: 0.95 }),
      rock: new THREE.MeshStandardMaterial({ map: TEX.rock, roughness: 0.9 }),
      water: new THREE.MeshStandardMaterial({ map: TEX.water, roughness: 0.12, metalness: 0.1, transparent: true, opacity: 0.9 }),
      bed: new THREE.MeshStandardMaterial({ color: PTMT.color("#2e4a3a"), roughness: 1 }),
      cliff: new THREE.MeshStandardMaterial({ color: PTMT.color("#8a7458"), roughness: 1 }),
    };
    const TERRAIN = { boar: "grass", swan: "water", dog: "rock" };
    const TOP = { road: 0, grass: 0.45, rock: 0.45, water: -0.25, high: 1.3 };
    // Cases factices regroupées par matière puis fusionnées (flushTiles) : quelques appels de dessin pour
    // tout le terrain, afin que les comptes de la galerie reflètent surtout les tours.
    let TILES = {};
    function bucket(key, geo) { (TILES[key] = TILES[key] || []).push(geo); }
    /** Une case de terrain à la position (x, z) ; renvoie la hauteur du dessus. */
    function tile(kind, x, z, base) {
      base = base === undefined ? -0.6 : base;
      const top = TOP[kind];
      if (kind === "water") {
        bucket("bed", new THREE.BoxGeometry(TILE, 0.1, TILE).translate(x, -0.9, z));
        bucket("water", new THREE.PlaneGeometry(TILE, TILE).rotateX(-Math.PI / 2).translate(x, top, z));
        return top;
      }
      const h = top - base;
      bucket(kind === "road" ? "cliffFlat" : "cliff", new THREE.BoxGeometry(TILE, h, TILE).translate(x, base + h / 2, z));
      bucket(kind === "high" ? "grass" : kind, new THREE.PlaneGeometry(TILE, TILE).rotateX(-Math.PI / 2).translate(x, top + 0.004, z));
      return top;
    }
    function flushTiles(parent) {
      const U = THREE.BufferGeometryUtils;
      for (const [key, list] of Object.entries(TILES)) {
        const geo = U ? U.mergeBufferGeometries(list.map((g) => (g.index ? g.toNonIndexed() : g))) : list[0];
        const m = new THREE.Mesh(geo, MAT[key === "cliffFlat" ? "cliff" : key]);
        m.receiveShadow = true;
        m.castShadow = key === "cliff";
        m.name = "terrain:" + key;
        parent.add(m);
      }
      TILES = {};
    }

    // Ennemi factice (échelle : ≈ 2,2 m), coloré, qui marche le long d'un chemin.
    function dummy(color) {
      const g = new THREE.Group();
      const m = new THREE.MeshStandardMaterial({ color: PTMT.color(color || "#c9c2b5"), roughness: 0.7 });
      const body = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.36, 1.1, 12), m); body.position.y = 0.6; body.castShadow = true;
      const head = new THREE.Mesh(new THREE.SphereGeometry(0.45, 14, 10), new THREE.MeshStandardMaterial({ color: PTMT.color("#f0c8a0"), roughness: 0.7 })); head.position.y = 1.6; head.castShadow = true;
      const hat = new THREE.Mesh(new THREE.CylinderGeometry(0.32, 0.5, 0.25, 12), m); hat.position.y = 1.95;
      g.add(body, head, hat);
      return g;
    }

    const items = []; // tours
    const walkers = []; // cibles
    const shots = []; // projectiles en vol
    const pending = []; // départs différés (délai renvoyé par attack())
    const labels = [];
    let root = null;
    const state = { auto: q.get("auto") !== "0", sel: false, frenzy: false, sweep: false, track: q.get("track") !== "0", walk: q.get("walk") !== "0", dazzle: false, labels: q.get("labels") !== "0", time: 0, flashCycle: false };
    const view = { mode: q.get("view") || "jeu", yaw: +(q.get("yaw") || 0), pitch: +(q.get("pitch") || 58), px: +(q.get("px") || 46), dist: 30, target: new THREE.Vector3() };
    const LEVELS = [[1, null], [2, null], [3, null], [4, "A"], [5, "A"], [6, "A"], [7, "A"], [4, "B"], [5, "B"], [6, "B"], [7, "B"]];
    const EVO = [[1, null], [2, null], [3, null], [4, "A"], [5, "A"], [6, "A"], [7, "A"], [1, null], [2, null], [3, null], [4, "B"], [5, "B"], [6, "B"], [7, "B"]];
    const NAMES = {
      boar: ["Marcassin", "Jeune sanglier", "Sanglier des talus", "Sanglier chasseur", "Grand Solitaire", "Laie baliste", "Catapulte à châtaignes"],
      swan: ["Cygneau", "Cygne", "Cygne majestueux", "Cygne des glaces", "Cygne royal", "Cygne noir", "Cygne noir enchanteur"],
      dog: ["Chiot berger", "Berger australien", "Berger de feu", "Dragon merle rouge", "Grand dragon rouge", "Dragon merle bleu", "Grand dragon bleu"],
    };
    function levelName(f, lv, sp) {
      const d = DATA && DATA.towerLevel && DATA.towerLevel(f, lv, sp);
      if (d && d.name) return d.name;
      const n = NAMES[f];
      return lv <= 3 ? n[lv - 1] : n[(sp === "B" ? 5 : 3) + (lv === 7 ? 1 : 0)];
    }
    // Projectiles v4 (anciens noms des données v3 → nouveaux) et jets.
    const V4SHOT = { waterJet: "waterOrb", iceShard: "iceOrb", darkWater: "darkOrb" };
    function towerData(f, lv, sp) {
      const d = (DATA && DATA.towerLevel && DATA.towerLevel(f, lv, sp)) || {};
      const shot = f === "boar" ? (sp === "B" ? "bigChestnut" : "chestnut") : f === "swan" ? (sp === "A" ? "iceOrb" : sp === "B" ? "darkOrb" : "waterOrb") : null;
      const beam = f === "dog" ? (sp === "A" ? "dragonFire" : sp === "B" ? "blueFire" : "fire") : null;
      return {
        rate: d.rate || (f === "boar" ? (sp === "B" ? 0.75 : 1.2 + lv * 0.1) : 1),
        range: (d.range || (f === "dog" ? 2.9 : 2.5)) * (q.get("range") ? +q.get("range") : 1.25),
        speed: d.speed || 8,
        splash: d.splash || (sp === "B" && f === "boar" ? 1 : 0),
        shot: V4SHOT[d.shot] || shot,
        beam,
        double: f === "boar" && lv === 7 && sp === "A", // deux bogues sur deux cibles
        twin: f === "dog" && lv === 7 && sp === "A", // deux jets (deux têtes)
        bounce: f === "dog" && lv === 7 && sp === "B", // le jet rebondit sur une seconde cible
        recharge: 1.4, // s par boule (cygne)
      };
    }

    function addLabel(obj, text, sub, y) {
      const el = document.createElement("div");
      el.className = "lbl";
      el.innerHTML = text + (sub ? "<small>" + sub + "</small>" : "");
      document.body.appendChild(el);
      labels.push({ el, obj, y });
      return labels[labels.length - 1];
    }
    function place(family, lv, sp, x, z, y, extra) {
      const api = M.ctTower(family, lv, sp, { terrain: extra && extra.terrain });
      api.object.position.set(x, y, z);
      root.add(api.object);
      const it = Object.assign({ api, family, lv, sp, x, z, y, cd: Math.random() * 1.2, d: towerData(family, lv, sp), beams: [], heat: [0, 0], tgt: [null, null] }, extra || {});
      initCharges(it);
      it.label = addLabel(api.object, levelName(family, lv, sp), (sp ? sp : "") + lv + " · " + api.height.toFixed(2) + " m", api.height + 0.45);
      items.push(it);
      return it;
    }
    function rebuild(it, lv, sp) {
      const pos = it.api.object.position.clone();
      stopBeams(it);
      it.api.dispose();
      it.api = M.ctTower(it.family, lv, sp, { terrain: it.terrain });
      it.api.object.position.copy(pos);
      root.add(it.api.object);
      it.lv = lv; it.sp = sp; it.d = towerData(it.family, lv, sp);
      initCharges(it);
      it.label.obj = it.api.object; it.label.y = it.api.height + 0.45;
      it.label.el.innerHTML = levelName(it.family, lv, sp) + "<small>" + (sp || "") + lv + " · " + it.api.height.toFixed(2) + " m</small>";
      it.api.setSelected(state.sel); it.api.setFrenzy(state.frenzy); it.api.setDazzled(state.dazzle);
      it.api.celebrate();
    }
    function initCharges(it) {
      if (it.family !== "swan") return;
      const c = it.api.charges ? it.api.charges() : { max: 3 };
      it.ch = { full: c.max, max: c.max, part: 0, burst: 0, gap: 0, cool: 0 };
      it.api.setCharges(it.ch.full, it.ch.max, 0);
    }

    /* ---------------------------------------------------------------- sections */
    function road(i0, i1, z, x0) { for (let i = i0; i <= i1; i++) tile("road", (x0 || 0) + i * TILE, z, -0.6); }
    function makeWalker(x, z, y, speed, color, x0, x1) {
      const d = dummy(color);
      d.position.set(x, y, z);
      root.add(d);
      const w = { obj: d, x0: x0 === undefined ? -12 : x0, x1: x1 === undefined ? 12 : x1, speed, y, z, phase: Math.random() * 6 };
      walkers.push(w);
      return w;
    }
    const COLORS = ["#c8433a", "#3a7ad8", "#e0b020", "#7a4ab8", "#3aa860", "#e07a30"];
    /** Section d'une famille : grille 4 × 3 (1-3 + évolution, A4-A7, B4-B7) le long d'un chemin avec des cibles. */
    function buildFamily(f) {
      const kind = TERRAIN[f];
      const cols = [-1.5, -0.5, 0.5, 1.5].map((c) => c * (TILE + 0.9));
      const rows = [-2 * (TILE + 0.9), -(TILE + 0.9), 0];
      const layout = [
        [[1, null], [2, null], [3, null], "evo"],
        [[4, "A"], [5, "A"], [6, "A"], [7, "A"]],
        [[4, "B"], [5, "B"], [6, "B"], [7, "B"]],
      ];
      layout.forEach((row, r) => row.forEach((cell, c) => {
        const x = cols[c], z = rows[r];
        const y = tile(kind, x, z);
        if (cell === "evo") { const it = place(f, 1, null, x, z, y, { evo: 0, terrain: kind }); it.label.el.innerHTML = "Évolution<small>N : niveau suivant</small>"; }
        else place(f, cell[0], cell[1], x, z, y, { terrain: kind });
      }));
      road(-3, 3, TILE * 1.4);
      for (let i = 0; i < 3; i++) makeWalker(-11 + i * 7.5, TILE * 1.4, 0, 1.4 + i * 0.2, COLORS[i]);
      return { center: [0, 0.8, -2.2], width: 30 };
    }
    /** Toutes les familles côte à côte. */
    function buildAll() {
      ["boar", "swan", "dog"].forEach((f, r) => {
        LEVELS.forEach(([lv, sp], c) => {
          const x = (c - 5) * (TILE + 0.4), z = (r - 1) * (TILE + 1.6);
          const y = tile(TERRAIN[f], x, z);
          place(f, lv, sp, x, z, y, { terrain: TERRAIN[f] });
        });
      });
      road(-6, 6, 2 * (TILE + 1.6) - 0.6);
      for (let i = 0; i < 4; i++) makeWalker(-20 + i * 11, 2 * (TILE + 1.6) - 0.6, 0, 1.6, COLORS[i], -22, 22);
      return { center: [0, 0.8, 1], width: 48 };
    }
    /**
     * Vignettes : chaque tour sur sa case, cases jointives, comme en partie (à juger à 30-60 px par case :
     * ?px=40). Rangées : sanglier, cygne, berger ; colonnes : niveaux 1, 2, 3, A4…A7, B4…B7.
     */
    function buildThumbs() {
      // ?cols=0,1,2 : seulement certaines colonnes (0 = niveau 1 … 10 = B7)
      const cols = q.get("cols") ? q.get("cols").split(",").map(Number) : LEVELS.map((_, i) => i);
      const n = cols.length;
      ["boar", "swan", "dog"].forEach((f, r) => {
        cols.forEach((ci, c) => {
          const [lv, sp] = LEVELS[ci];
          const x = (c - (n - 1) / 2) * TILE, z = (r - 1) * TILE;
          const y = tile(TERRAIN[f], x, z);
          const it = place(f, lv, sp, x, z, y, { terrain: TERRAIN[f] });
          it.api.aim(0.5);
        });
      });
      // un chemin et des herbes autour, pour le contraste
      const h = (n + 1) / 2;
      for (let c = -h; c <= h; c++) { tile("road", c * TILE, 2 * TILE, -0.6); tile("grass", c * TILE, -2 * TILE); }
      for (let r = -1; r <= 1; r++) { tile("grass", -h * TILE, r * TILE); tile("grass", h * TILE, r * TILE); }
      state.track = q.get("track") === "1";
      return { center: [0, 0.4, 0], width: (n + 2) * TILE };
    }
    /** Petit plateau façon jeu : chemin en S, herbe, eau, roche ; tours de tous niveaux. */
    function buildBoard() {
      const map = [
        ".b..~~~~.^d^",
        "....~s~~.^^^",
        "############",
        "..b.~~~~~.^#",
        ".b..~~s~.^d#",
        "....~~~~.^^#",
        "############",
      ];
      const W = 12, H = map.length;
      const towers = { "1,0": ["boar", 1, null], "5,1": ["swan", 2, null], "10,0": ["dog", 2, null], "2,3": ["boar", 3, null], "1,4": ["boar", 5, "A"], "6,4": ["swan", 7, "B"], "10,4": ["dog", 7, "A"] };
      for (let j = 0; j < H; j++) for (let i = 0; i < W; i++) {
        const ch = map[j][i] || ".";
        const x = (i - W / 2 + 0.5) * TILE, z = (j - H / 2 + 0.5) * TILE;
        const kind = ch === "#" ? "road" : ch === "~" || ch === "s" ? "water" : ch === "^" || ch === "d" ? "rock" : "grass";
        const y = tile(kind, x, z);
        const tw = towers[i + "," + j];
        if (tw) place(tw[0], tw[1], tw[2], x, z, y, { terrain: kind });
      }
      const P = (i, j) => [(i - W / 2 + 0.5) * TILE, (j - H / 2 + 0.5) * TILE];
      const route = [P(-1, 2), P(11, 2), P(11, 6), P(-1, 6)];
      for (let i = 0; i < 5; i++) {
        const d = dummy(COLORS[i]);
        root.add(d);
        walkers.push({ obj: d, route, s: i * 7, speed: 1.3 + i * 0.1, y: 0 });
      }
      return { center: [0, 0, 0], width: W * TILE + 2 };
    }
    /**
     * Partie type : plateau 16 × 9, chemin en lacets et n tours variées (?n=30 par défaut, jusqu'à 60),
     * pour mesurer les appels de dessin réels (G.calls()).
     */
    function buildGame() {
      const n = Math.max(1, Math.min(60, +(q.get("n") || 30)));
      const W = 16, H = 9;
      const P = (i, j) => [(i - W / 2 + 0.5) * TILE, (j - H / 2 + 0.5) * TILE];
      const isPath = (i, j) => j === 1 || j === 4 || j === 7 || (i === 15 && j > 1 && j < 4) || (i === 0 && j > 4 && j < 7);
      const all = [];
      for (const f of ["boar", "swan", "dog"]) for (const [lv, sp] of LEVELS) all.push([f, lv, sp]);
      let seed = 7;

    addEventListener("resize", () => { renderer.setSize(innerWidth, innerHeight); });

    const statsEl = document.getElementById("stats");
    const clock = new THREE.Clock();
    let frames = 0;
    const v3 = new THREE.Vector3();
    const speed = +(q.get("speed") || 1);
    const fixedDt = q.get("dt") ? +q.get("dt") : 0;
    function stepWalkers(dt) {
      if (!state.walk) dt = 0;
      for (const w of walkers) {
        if (w.route) {
          w.s += dt * w.speed;
          let s = w.s, i = 0;
          const R = w.route;
          let seg = 0;
          for (i = 0; i < R.length - 1; i++) { seg = Math.hypot(R[i + 1][0] - R[i][0], R[i + 1][1] - R[i][1]); if (s <= seg) break; s -= seg; }
          if (i >= R.length - 1) { w.s = 0; continue; }
          const k = s / seg;
          w.obj.position.set(THREE.MathUtils.lerp(R[i][0], R[i + 1][0], k), Math.abs(Math.sin(state.time * 8 + w.speed)) * 0.08, THREE.MathUtils.lerp(R[i][1], R[i + 1][1], k));
          w.obj.rotation.y = Math.atan2(R[i + 1][0] - R[i][0], R[i + 1][1] - R[i][1]);
        } else {
          w.obj.position.x += w.speed * dt;
          if (w.obj.position.x > w.x1) w.obj.position.x = w.x0;
          if (w.obj.position.x < w.x0) w.obj.position.x = w.x1;
          w.obj.position.y = w.y + Math.abs(Math.sin(state.time * 8 + w.phase)) * 0.08;
          w.obj.rotation.y = w.speed > 0 ? Math.PI / 2 : -Math.PI / 2;
        }
      }
    }
    function frame() {
      requestAnimationFrame(frame);
      const real = Math.min(0.1, clock.getDelta());
      const dt = state.frozen ? 0 : fixedDt || real * speed;
      step(dt);
      draw();
    }
    let flashT = 0;
    /** Avance la scène de dt secondes (tours, cibles, attaques, effets). */
    function step(dt) {
      state.time += dt;
      const time = state.time;
      stepWalkers(dt);
      // éblouissement en boucle (section dédiée) : 2,5 s ébloui, 2,5 s normal
      if (state.flashCycle) {
        flashT += dt;
        const on = flashT % 5 < 2.5;
        if (on !== state.dazzle) { state.dazzle = on; if (on) flashAll(); applyToggles(); }
      }
      for (const it of items) {
        const list = state.auto || state.track ? inRange(it) : [];
        if (state.sweep) it.api.aim(Math.sin(time * 0.7 + it.x * 0.2) * 2.2);
        else if (state.track && walkers.length) {
          const w = (it.family === "dog" && it.tgt[0]) || list[0] || nearestWalker(it);
          if (w) it.api.aim(yawTo(it, w));
        }
        if (state.auto && !state.dazzle) {
          if (it.family === "dog") stepBeam(it, dt, list);
          else if (it.family === "swan") stepCharges(it, dt, list);
          else {
            it.cd -= dt;
            if (it.cd <= 0 && list.length) { it.cd = 1 / (it.d.rate * (state.frenzy ? 2 : 1)); fireShot(it, list); }
          }
        } else if (it.family === "dog") stopBeams(it);
        else if (it.family === "swan" && state.auto) stepCharges(it, dt, []);
        it.api.update(dt, time);
      }
      stepPending(dt);
      if (fxOK) { stepShots(dt); stepLabs(dt); PTMT.fx.update(dt, time); }
    }
    function draw() {
      updateCamera();
      renderer.render(scene, camera);
      if (state.labels) for (const l of labels) {
        v3.set(0, l.y, 0);
        l.obj.localToWorld(v3);
        v3.project(camera);
        const vis = v3.z < 1 && Math.abs(v3.x) < 1.1 && Math.abs(v3.y) < 1.1;
        l.el.style.display = vis ? "" : "none";
        if (vis) l.el.style.transform = `translate(${((v3.x + 1) / 2) * innerWidth}px, ${((1 - v3.y) / 2) * innerHeight}px) translate(-50%, -100%)`;
      }
      frames++;
      if (frames % 20 === 0) {
        const r = renderer.info.render;
        statsEl.textContent = `${SECTIONS[current].name} · ${items.length} tours · ${r.calls} appels (+${shadowCalls} ombre) · ${r.triangles.toLocaleString("fr-FR")} triangles · vue ${view.mode}${view.mode === "jeu" ? " · " + Math.round(view.px) + " px/case" : ""}`;
      }
    }

    // API de test (outil de capture).
    window.G = {
      THREE, scene, renderer, items, state, view, act, showSection, walkers, shots,
      get camera() { return camera; },
      stats() {
        return items.map((it) => Object.assign({ name: it.family + ":" + (it.sp || "") + it.lv, height: it.api.height }, it.api.stats(), { meshes: countMeshes(it.api.object) }));
      },
      info() { return Object.assign({}, renderer.info.render, { programs: renderer.info.programs.length, geometries: renderer.info.memory.geometries, textures: renderer.info.memory.textures }); },
      set(k, v) { state[k] = v; applyToggles(); },
      /** Gèle le temps (le rendu continue) ; advance(s) avance alors la scène à pas de 1/60 s. */
      freeze(b) { state.frozen = b !== false; },
      burst(kind, x, y, z, o) { if (fxOK) PTMT.fx.burst(kind, new THREE.Vector3(x, y, z), o || {}); },
      /** Appels de dessin des seules tours (le reste de la scène masqué le temps d'un rendu). */
      towerCalls() {
        const towers = new Set(items.map((it) => it.api.object));
        const hidden = [];
        for (const c of root.children) if (!towers.has(c) && c.visible) { c.visible = false; hidden.push(c); }
        const fxRoot = scene.getObjectByName("ptmt:fx");
        if (fxRoot) fxRoot.visible = false;
        renderer.render(scene, camera);
        const r = { calls: renderer.info.render.calls, shadow: shadowCalls, triangles: renderer.info.render.triangles, towers: items.length, shadowCasters: items.filter((it) => it.api.object.children[0].castShadow).length };
        for (const c of hidden) c.visible = true;
        if (fxRoot) fxRoot.visible = true;
        return r;
      },
      /** Comptes réels d'une image : scène entière puis tours seules (passe principale et passe d'ombre). */
      calls() {
        renderer.render(scene, camera);
        const all = { calls: renderer.info.render.calls, shadow: shadowCalls, triangles: renderer.info.render.triangles };
        const towers = this.towerCalls();
        const n = Math.max(1, towers.towers);
        return { all, towers, perTower: +(towers.calls / n).toFixed(2), perTowerShadow: +(towers.shadow / n).toFixed(2) };
      },
      advance(s) { for (let t = 0; t < s - 1e-6; t += 1 / 60) step(Math.min(1 / 60, s - t)); draw(); },
      attack(filter) { for (const it of items) if (!filter || filter(it)) it.api.attack(); },
      aim(yaw) { state.track = false; state.sweep = false; for (const it of items) it.api.aim(yaw); },
      look(tx, ty, tz, px, pitch, yaw) { view.mode = "jeu"; view.target.set(tx, ty, tz); if (px) view.px = px; if (pitch) view.pitch = pitch; if (yaw !== undefined) view.yaw = yaw; },
      close(tx, ty, tz, dist, pitch, yaw) { view.mode = "proche"; view.target.set(tx, ty, tz); view.dist = dist; if (pitch) view.pitch = pitch; if (yaw !== undefined) view.yaw = yaw; },
    };
    function countMeshes(o) { let n = 0; o.traverse((c) => { if ((c.isMesh || c.isSprite) && c.visible) n++; }); return n; }

    const sec = q.get("solo") ? "solo" : q.get("section") || "boar";
    showSection(SECTIONS[sec] ? sec : "boar");
    if (q.get("sel") === "1") act("s");
    if (q.get("frenzy") === "1") act("z");
    if (q.get("dazzle") === "1") act("e");
    if (q.get("labels") === "0") { state.labels = false; applyToggles(); }
    if (q.get("ui") === "0") { document.getElementById("ui").style.display = "none"; document.getElementById("stats").style.display = "none"; }
    else if (innerWidth < 600) document.getElementById("ui").classList.add("hidden");
    frame();
  }
})();
</script>
</body>
</html>
