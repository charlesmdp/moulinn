<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<script>
/* Cloudflare Pages sert cette page pour toute adresse inconnue : /Moulin, /3d, /Build, /Jeu… tapées
   autrement mènent à la bonne page (jamais vers elle-même, pour ne pas boucler). */
(function(){var p=location.pathname,m=/^(.*?\/)(moulin|3d|build|jeu)\/?$/i.exec(p);if(!m)return;var k=m[2].toLowerCase(),c=k==="3d"?"3D":k;if(m[2]!==c||!/\/$/.test(p))location.replace(m[1]+c+"/"+location.search+location.hash);})();
</script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Moulin de Saint-Christophe, Elven.">
<meta name="color-scheme" content="light dark">
<title>Moulin de Saint-Christophe</title>
<style>
:root {
  --bg: #e9ede1;
  --bg-2: #cfdcc4;
  --card: #fbfaf4;
  --ink: #263d30;
  --ink-2: #5d6a5e;
  --line: #c3cdbc;
  --accent: #334d3c;
  --accent-ink: #f4f5ec;
  --bad: #a3392a;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1d241f;
    --bg-2: #27322a;
    --card: #2a332c;
    --ink: #e6eadf;
    --ink-2: #a9b4a6;
    --line: #48574a;
    --accent: #d6e2cd;
    --accent-ink: #213128;
    --bad: #f08f7f;
  }
}
:root[data-theme="dark"] {
  --bg: #1d241f;
  --bg-2: #27322a;
  --card: #2a332c;
  --ink: #e6eadf;
  --ink-2: #a9b4a6;
  --line: #48574a;
  --accent: #d6e2cd;
  --accent-ink: #213128;
  --bad: #f08f7f;
}
* {
  box-sizing: border-box;
}
html {
  height: 100%;
}
body {
  min-height: 100%;
  margin: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px 16px calc(24px + env(safe-area-inset-bottom, 0px));
  background: radial-gradient(120% 80% at 50% 0%, var(--bg) 40%, var(--bg-2));
  color: var(--ink);
  font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
.gate {
  width: 100%;
  max-width: 380px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  padding: 30px 26px 26px;
  border: 1px solid var(--line);
  border-radius: 20px;
  background: var(--card);
  box-shadow: 0 18px 40px rgba(30, 45, 34, 0.16);
  text-align: center;
}
.gate svg {
  width: 74px;
  height: 74px;
  color: var(--accent);
}
h1 {
  margin: 0;
  font: 600 24px/1.2 Georgia, "Times New Roman", serif;
  letter-spacing: 0.2px;
}
.gate p {
  margin: 0;
  color: var(--ink-2);
  font-size: 15px;
}
.field {
  width: 100%;
  display: flex;
  gap: 8px;
  margin-top: 4px;
}
input {
  flex: 1;
  min-width: 0;
  height: 46px;
  padding: 0 14px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: transparent;
  color: var(--ink);
  font: inherit;
  font-size: 16px;
}
input:focus-visible,
button:focus-visible {
  outline: 3px solid color-mix(in srgb, var(--accent) 45%, transparent);
  outline-offset: 2px;
}
button {
  height: 46px;
  padding: 0 18px;
  border: 0;
  border-radius: 12px;
  background: var(--accent);
  color: var(--accent-ink);
  font: 600 16px/1 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  cursor: pointer;
}
button:active {
  transform: translateY(1px);
}
.err {
  min-height: 1.45em;
  color: var(--bad) !important;
  font-weight: 600;
}
.shake {
  animation: shake 0.36s ease-in-out;
}
@keyframes shake {
  20%,
  60% {
    transform: translateX(-6px);
  }
  40%,
  80% {
    transform: translateX(6px);
  }
}
.sr {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}
@media (prefers-reduced-motion: reduce) {
  .shake {
    animation: none;
  }
}
</style>
</head>
<body>
<form class="gate" data-gate autocomplete="off">
  <svg viewBox="0 0 64 64" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 56h48"/>
    <path d="M14 56V30l14-12 14 12v26"/>
    <path d="M24 56V44h8v12"/>
    <path d="M20 34h6v5h-6z"/>
    <circle cx="46" cy="42" r="11"/>
    <circle cx="46" cy="42" r="2.5"/>
    <path d="M46 31v22M35 42h22M38.2 34.2l15.6 15.6M53.8 34.2 38.2 49.8"/>
  </svg>
  <h1>Moulin de Saint-Christophe</h1>
  <p>Entrée réservée : saisis le mot de passe.</p>
  <div class="field">
    <label class="sr" for="gate-password">Mot de passe</label>
    <input id="gate-password" name="password" type="password" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Mot de passe" required autofocus>
    <button type="submit">Entrer</button>
  </div>
  <p class="err" data-gate-error role="alert" aria-live="assertive"></p>
</form>
<script>
/* Simple barrière : la page /moulin/ reste ouverte à qui connaît son adresse. Seule l'empreinte
   SHA-256 du mot de passe figure ici (minuscules, espaces retirés) ; elle est posée par le build. */
(function () {
  var HASH = "f2d81a260dea8a100dd517984e53c56a7523d96942a834b9cdc249bd4e8c7aa9";
  var form = document.querySelector("[data-gate]");
  var input = document.getElementById("gate-password");
  var error = document.querySelector("[data-gate-error]");
  function hex(buffer) {
    return Array.prototype.map.call(new Uint8Array(buffer), function (b) { return ("0" + b.toString(16)).slice(-2); }).join("");
  }
  function refuse(text) {
    error.textContent = text;
    form.classList.remove("shake");
    void form.offsetWidth;
    form.classList.add("shake");
    input.select();
  }
  form.addEventListener("submit", function (event) {
    event.preventDefault();
    var value = input.value.trim().toLowerCase();
    if (!value) return refuse("Saisis le mot de passe.");
    if (!(window.crypto && crypto.subtle && window.TextEncoder)) return refuse("Ce navigateur ne peut pas vérifier le mot de passe : ouvre le site en HTTPS.");
    crypto.subtle.digest("SHA-256", new TextEncoder().encode(value)).then(function (digest) {
      if (hex(digest) === HASH) {
        error.textContent = "";
        location.href = "/moulin/";
      } else refuse("Mot de passe incorrect.");
    }, function () {
      refuse("Vérification impossible : recharge la page.");
    });
  });
  input.addEventListener("input", function () {
    if (error.textContent) error.textContent = "";
  });
})();
</script>
</body>
</html>
